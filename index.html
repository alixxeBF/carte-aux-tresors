<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ma Carte Interactive</title>
  
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
    /* Fond gris clair pour voir les limites de la carte */
    #map { height: 100%; width: 100%; background: #e5e5e5; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // 1. Initialisation de la carte plate
    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -3,
      maxZoom: 5
    });

    // 2. Dimensions de votre plan de travail (Hauteur et Largeur)
    var largeur = 2000;
    var hauteur = 1500;
    var bounds = [[0, 0], [hauteur, largeur]];

    // 3. Affichage de votre fichier SVG
    L.imageOverlay('carte.svg', bounds).addTo(map);

    // 4. Centrer la carte au démarrage
    map.fitBounds(bounds);

    // 5. Exemple d'épingle au centre de l'image
    L.marker([hauteur / 2, largeur / 2])
      .addTo(map)
      .bindPopup("<b>Bienvenue !</b><br>Zoomez pour explorer.");
  </script>

</body>
</html>
