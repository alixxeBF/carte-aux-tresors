<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ma Carte Interactive</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
    #map { height: 100%; width: 100%; background: #f4f4f4; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -3,
      maxZoom: 5
    });

    // Remplacez 2000 et 1500 par la largeur et la hauteur de votre dessin
    var largeur = 2000;
    var hauteur = 1500;
    var bounds = [[0, 0], [hauteur, largeur]];

    L.imageOverlay('carte.svg', bounds).addTo(map);
    map.fitBounds(bounds);

    // Exemple d'épingle au centre
    L.marker([hauteur / 2, largeur / 2])
      .addTo(map)
      .bindPopup("<b>Bienvenue !</b><br>Explorez la carte en zoomant.");
  </script>
</body>
</html>
