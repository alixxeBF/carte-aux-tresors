<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Test Carte</title>
  
  <!-- Chargement depuis Cloudflare (souvent plus fiable sur mobile) -->
  <link rel="stylesheet" href="https://cloudflare.com" />
  <script src="https://cloudflare.com"></script>
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
    #map { height: 100%; width: 100%; background: #e5e5e5; }
    #debug { position: fixed; top: 10px; left: 50px; right: 10px; background: #ffdddd; color: #900; padding: 10px; z-index: 9999; font-family: sans-serif; display: none; border: 1px solid red; }
  </style>
</head>
<body>

  <div id="debug"></div>
  <div id="map"></div>

  <script>
    // Affiche toute erreur directement à l'écran
    window.onerror = function(msg, url, line) {
      var box = document.getElementById('debug');
      box.style.display = 'block';
      box.innerHTML += "<b>Erreur :</b> " + msg + " (ligne " + line + ")<br>";
    };

    if (typeof L === 'undefined') {
      throw new Error("La bibliothèque Leaflet n'a pas pu être téléchargée.");
    }

    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -3,
      maxZoom: 5
    });

    var largeur = 2000;
    var hauteur = 1500;
    
    var southWest = new L.LatLng(0, 0);
    var northEast = new L.LatLng(hauteur, largeur);
    var bounds = new L.LatLngBounds(southWest, northEast);

    L.imageOverlay('carte.svg', bounds).addTo(map);
    map.fitBounds(bounds);

    L.marker([hauteur / 2, largeur / 2])
      .addTo(map)
      .bindPopup("<b>Ça fonctionne !</b>");
  </script>

</body>
</html>
