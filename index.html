<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Permet de zoomer librement avec les doigts sur téléphone et iPad -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, user-scalable=yes" />
  <title>Mon Illustration</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      /* L'image s'adapte à l'écran au départ sans être coupée */
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }
  </style>
</head>
<body>

  <img src="carte.svg" alt="Illustration vectorielle" />

</body>
</html>
