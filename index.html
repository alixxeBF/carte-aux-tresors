<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ma Carte Interactive</title>
  
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
    #map { height: 100%; width: 100%; background: #e5e5e5; }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -3,
      maxZoom: 5
    });

    var largeur = 2000;
    var hauteur = 1500;
    
    var southWest = new L.LatLng(0, 0);
    var northEast = new L.LatLng(hauteur, largeur);
    var bounds = new L.LatLngBounds(southWest, northEast);

    L.imageOverlay('carte.svg', bounds).addTo(map);
    map.fitBounds(bounds);

    L.marker([hauteur / 2, largeur / 2])
      .addTo(map)
      .bindPopup("<b>Bienvenue !</b><br>Zoomez pour explorer.");
  </script>

</body>
</html>
